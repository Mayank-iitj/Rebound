version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEMO_MODE=true
      - PORT=8000
    volumes:
      - ../apps/api:/app/apps/api
      - ../rebound.db:/app/rebound.db
    restart: unless-stopped

